[program:box-agent]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/box-agent.sh
autostart=true
autorestart=unexpected
exitcodes=0
; startsecs=0: box-agent.sh's self-skip path (PROVIDER/token/model unset)
; exits in milliseconds - well under supervisord's default startsecs=1, so
; without this override, 3 quick clean exits get misclassified as a failed
; launch (FATAL, "Exited too quickly") instead of an intentional stop, and
; supervisord stops trying entirely until a manual `supervisorctl start`.
; startsecs=0 makes any spawn count as "started" immediately regardless of
; how fast it then exits, so exitcodes/autorestart above are what decide
; whether it restarts - not exit timing.
startsecs=0
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
